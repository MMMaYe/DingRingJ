spring:
  profiles:
    active: dev
  application:
    name: dingring
  # 排除 PgVectorStore 自动配置：Phase E 用第二数据源（PostgreSQL）手动创建 PgVectorStore，
  # 若不禁用，自动配置会用主 MySQL 数据源执行 pgvector SQL 导致启动失败
  autoconfigure:
    exclude: org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  # SAA Nacos Prompt（Phase A：提示词热更新基础设施）
  # 有 Nacos 时从 Nacos 实时加载最新模板（热更新），无 Nacos 时 PromptTemplateLoader 降级到 classpath:/prompt-config.json
  ai:
    nacos:
      prompt:
        template:
          enabled: true
    # Phase E：PostgreSQL 向量库（第二数据源，仅用于 PgVectorStore，不参与 MyBatis）
    vectorstore:
      pgvector:
        datasource:
          url: jdbc:postgresql://101.33.227.80:5432/my_rag
          username: postgres
          password: postgres123
          driver-class-name: org.postgresql.Driver
  # Nacos 连接参数（本地开发可不配，PromptTemplateLoader 自动降级到本地 classpath 加载）
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
  # MySQL 生产库（公网地址，必须配置连接保活/探活防止 NAT/防火墙静默断连）
  datasource:
    url: jdbc:mysql://101.33.227.80:3306/ring_chat?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: "MySQL@123456"
    # HikariCP 连接池（公网数据库专属配置，核心是：短寿命 + 借前探活 + 空闲保活 + 泄露检测）
    hikari:
      # 连接池容量（默认10，峰值并发写多可以调大；单群串行引擎 + 多HTTP接口，20足够）
      maximum-pool-size: 20
      # 最小空闲连接（默认=max，这里设 5，避免冷启动时 HTTP 请求排队等建连）
      minimum-idle: 5
      # 拿不到连接多久报错（默认30s太长，8s快速失败，前端友好）
      connection-timeout: 8000
      # 连接最大存活时间（核心！默认30min太长；公网 NAT/防火墙一般 3-5min 就悄悄掐连接，
      # 所以设为 2min，HikariCP 会在连接满 2min 时主动报废换新，从根源避免"借到死连接"）
      max-lifetime: 60000
      # 空闲超过 1min 的连接回收（避免长期占着茅坑不拉屎）
      idle-timeout: 60000
      # 空闲连接保活心跳（每 1min 发一次 SELECT 1，防止 NAT 会话表老化被清）
      keepalive-time: 60000
      # 借出连接前的探活 SQL（关键！确保不会把已经死了的连接给业务代码用；
      # 没有这行，Hikari 以为连接活着，代码一用就爆 "No operations allowed after connection closed"）
      connection-test-query: SELECT 1
      # 连接泄露检测：借出去 10s 不归还，就打印 WARN 堆栈（定位谁忘记关 ResultSet/Statement/事务不提交）
      leak-detection-threshold: 10000
      # 给连接池起个名字，看日志一目了然
      pool-name: DingRingHikariPool
  # 表结构与种子数据通过 MySQL MCP 手动管理，不在启动时自动执行
  sql:
    init:
      mode: never
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

server:
  port: 8080

mybatis:
  # Mapper XML 文件位置（与 Mapper 接口同包名映射，namespace 全限定类名）
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    # 下划线 -> 驼峰自动映射（chat_group_id -> chatGroupId）
    map-underscore-to-camel-case: true

dingring:
  llm:
    # true = 使用 Mock LLM（无需真实 API Key，演示完整闭环）
    mock: false
    # LLM HTTP 连接/读超时（秒）：必须设置，默认客户端无超时会永久卡死对话引擎线程
    connect-timeout-seconds: 10
    read-timeout-seconds: 120
  rag:
    # Phase E：RAG 知识库总开关。false 时不加载向量库数据源/PgVectorStore/RAG Hook，
    # 群聊主流程不受影响（RAG 是增强不是依赖）
    enabled: true
    # Embedding 模型提供商：mock=本地确定性向量（无 API 成本，用于框架联调）；后续接入真实模型改配置即可
    embedding:
      provider: mock
    # 上传文件本地存储根目录
    storage:
      local-path: ./rag-files
    # LLM 重排使用的轻量 Agent ID（默认 routeJudge，DeepSeek-V4-Flash）
    reranker:
      agent-id: 6
  skill:
    # Phase F：SKILL 配置模块总开关。true 时启动加载 classpath:skill-config.json 种子技能（幂等写入 skill 表）
    enabled: true
  supervisor:
    # Phase F：WORK 任务 Supervisor 编排模式。true 时由编排 Agent 拆解任务并委派子 Agent；
    # false 或成员不足 2 人时自动降级为单 Agent 深度 ReAct（方案十一回退策略）
    enabled: false
  moderator:
    # Moderator 主持人（Phase 2）：true 时由 LLM 接管选人/继续判断/收束判断；失败自动回退评分调度
    enabled: false
    # 主持人判定模型（空 = 复用群首个成员 Agent 的模型；建议配快模型如 step-3.7-flash）
    model: ""
    # 主持人判定输入的讨论消息窗口（条）
    context-window: 30
  streaming:
    # 流式输出（Phase 3）：true 时 Agent 发言逐块推送 MESSAGE_DELTA，完成推 MESSAGE_COMPLETE；落库语义不变
    enabled: true
  orchestrator:
    # 上下文滑动窗口（条）
    context-window: 200
    # 单主题 Agent 最大发言轮次（达到后自动触发结束）
    max-rounds: 100
    # 用户不@任何人时的自动接话条数（闲聊态）
    auto-replies: 3
    # 讨论态自主发言间隔随机区间（毫秒，拟人节奏）
    pace-min-ms: 5000
    pace-max-ms: 15000
    # 不同 Agent 连续 PASS 达该数触发收敛收束
    converge-pass-count: 2
    # 讨论态附带的近期闲聊条数（群氛围前置段）
    chat-context-window: 20
    # 闲聊积累多少条触发画像提炼
    profile-extract-threshold: 15
    # 追溯建题最多回填闲聊条数
    backfill-limit: 15
    # 发散模式发言间隔（毫秒，轻量防刷屏）
    diverge-pace-ms: 2000
    # 发散最大轮次（自动回拉收敛）
    max-diverge-rounds: 3
    # 提议收束后等用户确认的超时（毫秒，5分钟）
    conclude-confirm-timeout-ms: 300000
    # CONCLUDING 状态超过该分钟数视为卡死（看门狗回滚）
    concluding-timeout-minutes: 5
    # 卡片对账回溯窗口（天）
    card-reconcile-window-days: 7
    # 意图路由 LLM 读超时（秒）：路由在群串行执行器内同步调用，短超时避免卡住全群
    route-timeout-seconds: 15
  logging:
    # 是否完整打印 LLM prompt（生产可关闭以减少日志量）
    llm-prompt-enabled: true
  debug:
    llm:
      # dev 环境开启调试接口；prod 务必在 application-prod.yml 中关闭
      enabled: true