spring:
  application:
    name: dingring
  # 默认使用 H2 内存库（演示模式）；生产切换 MySQL 见下方注释
  datasource:
    url: jdbc:h2:mem:dingring;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  # url: jdbc:mysql://localhost:3306/dingring?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
  # driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

mybatis:
  configuration:
    map-underscore-to-camel-case: true

dingring:
  llm:
    # true = 使用 Mock LLM（无需真实 API Key，演示完整闭环）
    mock: true
  orchestrator:
    # 上下文滑动窗口（条）
    context-window: 200
    # 单主题 Agent 最大发言轮次（达到后自动触发结束）
    max-rounds: 20
    # 用户不@任何人时的自动接话条数
    auto-replies: 2

logging:
  level:
    com.dingring: info
