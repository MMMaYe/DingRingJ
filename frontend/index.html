<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DingRing</title>
    <script>
      // 在 React 渲染前同步设置主题，避免首屏闪烁
      // 默认 dark；若用户曾切换为 light 则立即生效
      (function () {
        try {
          var t = localStorage.getItem('dingring-theme');
          if (t === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
